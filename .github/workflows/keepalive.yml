name: keep the api warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "API_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "${{ vars.API_URL }}/health"
