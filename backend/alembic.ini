# Alembic configuration.
#
# There is deliberately no sqlalchemy.url here. alembic/env.py sets it from
# application settings, so database credentials live only in the environment
# and never in a tracked file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Logging configuration below is loaded by env.py through
# logging.config.fileConfig, so these sections are required, not decorative.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
